substitutions:
  static_ip: 192.168.178.113
  gateway: 192.168.178.1

esphome:
  name: lg-wh27s
  friendly_name: LG WH27S Water Heater
  project:
    name: community.lg_wh27s
    version: 0.9.2
  on_boot:
    priority: -110
    then:
      - switch.turn_on: wh27s_tx_enable

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_NONE: "y"
      CONFIG_BOOTLOADER_LOG_LEVEL_NONE: "y"

packages:
  wh27s: !include wh27s.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: ${static_ip}
  manual_ip:
    static_ip: ${static_ip}
    gateway: ${gateway}
    subnet: 255.255.255.0
    dns1: 8.8.8.8
  reboot_timeout: 0s
  ap:
    ssid: WH27S UART Recovery
    password: !secret fallback_password

captive_portal:

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server

web_server:
  port: 80
  version: 3
  auth:
    username: !secret web_username
    password: !secret web_password

uart:
  id: wh27s_uart
  rx_pin: GPIO16
  tx_pin: GPIO17
