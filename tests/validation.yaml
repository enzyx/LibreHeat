substitutions:
  wh27s_header_dir: ../src

esphome:
  name: wh27s-build-validation

esp32:
  board: esp32dev
  framework:
    type: esp-idf

packages:
  wh27s: !include ../wh27s.yaml

wifi:
  ssid: VALIDATION_ONLY_DO_NOT_FLASH
  password: VALIDATION_ONLY_DO_NOT_FLASH
  reboot_timeout: 0s

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
  - platform: web_server

web_server:
  port: 80
  version: 3

uart:
  id: wh27s_uart
  rx_pin: GPIO16
  tx_pin: GPIO17