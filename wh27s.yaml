substitutions:
  wh27s_header_dir: src

esphome:
  includes:
    - ${wh27s_header_dir}/wh27s_uart.h
    - ${wh27s_header_dir}/wh27s_diagnosis.h
    - ${wh27s_header_dir}/wh27s_esphome.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          auto *link = new wh27s::ResearchLink(id(wh27s_uart));
          link->on_raw = [](const std::string &raw) {
            id(wh27s_last_frame).publish_state(raw);
          };
          link->on_diagnosis = [](const std::string &raw) {
            id(wh27s_diagnosis).publish_state(raw);
          };
          link->on_diagnosis_decoded = [](const wh27s::DiagnosisResult &result) {
            id(wh27s_diagnosis_decoded).publish_state(result.summary());
            id(wh27s_diagnosis_index).publish_state(result.valid ? result.index : NAN);
          };
          link->on_firmware = [](const std::vector<wh27s::FirmwareRecord> &records) {
            std::string raw;
            for (const auto &record : records) {
              if (!raw.empty()) raw += "; ";
              raw += std::to_string(record.type) + ":" + record.part_number() + "/" + record.checksum_hex();
              if (record.type == 11) {
                id(wh27s_firmware_11).publish_state(record.part_number());
                id(wh27s_checksum_11).publish_state(record.checksum_hex());
              } else if (record.type == 12) {
                id(wh27s_firmware_12).publish_state(record.part_number());
                id(wh27s_checksum_12).publish_state(record.checksum_hex());
              }
            }
            id(wh27s_firmware_records).publish_state(raw);
          };
          link->on_capabilities = [](const std::vector<wh27s::Field> &fields) {
            id(wh27s_capabilities).publish_state(wh27s::field_list(fields));
            std::string modes;
            for (const auto &field : fields) {
              if (field.type != 727) continue;
              if (!modes.empty()) modes += "; ";
              const char *name = wh27s::mode_name(field.value);
              modes += name != nullptr ? name : std::to_string(field.value);
            }
            id(wh27s_supported_modes).publish_state(modes);
          };
          link->on_field = [](uint16_t type, uint32_t value) {
            switch (type) {
              case 503:
                if (value <= 1) id(wh27s_operation).publish_state(value == 1);
                break;
              case 649:
                if (value <= 1) id(wh27s_schedule).publish_state(value == 1);
                break;
              case 505: {
                const char *name = wh27s::mode_name(value);
                if (name != nullptr) id(wh27s_operating_mode).publish_state(name);
                break;
              }
              case 597: id(wh27s_current_temperature).publish_state(value / 2.0f); break;
              case 598:
                id(wh27s_target_temperature).publish_state(value / 2.0f);
                id(wh27s_set_temperature).publish_state(value / 2.0f);
                break;
            }
          };
          link->on_bridge_closed = []() { id(wh27s_bridge_mode).publish_state(false); };
          wh27s::research_link() = link;

logger:
  baud_rate: 0
  level: DEBUG
  tx_buffer_size: 512

uart:
  id: wh27s_uart
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 4096

globals:
  - id: wh27s_energy_total_cwh
    type: uint32_t
    restore_value: true
    initial_value: '0'

interval:
  - interval: 10ms
    then:
      - lambda: |-
          if (wh27s::research_link() != nullptr) wh27s::research_link()->poll();

switch:
  - platform: template
    name: UART Bridge Mode
    icon: mdi:lan-connect
    id: wh27s_bridge_mode
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          auto *link = wh27s::research_link();
          if (link == nullptr || !link->start_bridge()) {
            id(wh27s_bridge_mode).publish_state(false);
            ESP_LOGW("wh27s", "Bridge refused: transmission disabled, control pending, or socket unavailable");
          }
    turn_off_action:
      - lambda: |-
          if (wh27s::research_link() != nullptr) wh27s::research_link()->stop_bridge();
  - platform: template
    name: UART Transmission Enable
    icon: mdi:transit-connection-variant
    id: wh27s_tx_enable
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          auto *link = wh27s::research_link();
          if (link != nullptr && link->tx_available) {
            link->transmit_enabled = true;
            link->start_reads();
          } else {
            id(wh27s_tx_enable).publish_state(false);
            ESP_LOGW("wh27s", "Transmission unavailable in receive-only firmware");
          }
    turn_off_action:
      - lambda: |-
          auto *link = wh27s::research_link();
          if (link != nullptr) {
            link->transmit_enabled = false;
            link->stop_bridge();
            link->temperature.cancel();
            link->session.stop();
          }
  # Panel "Schedule" indicator (field 649); state comes only from heater reports.
  - platform: template
    name: Schedule
    id: wh27s_schedule
    icon: mdi:calendar-clock
    optimistic: false
    restore_mode: DISABLED
    turn_on_action:
      - lambda: |-
          if (wh27s::research_link() != nullptr) wh27s::research_link()->set_schedule(true);
    turn_off_action:
      - lambda: |-
          if (wh27s::research_link() != nullptr) wh27s::research_link()->set_schedule(false);
  # Off = 649=1 then 503=0 (stock schedule behaviour); clearing Schedule while off switches the heater on.
  - platform: template
    name: Operation
    id: wh27s_operation
    icon: mdi:power
    optimistic: false
    restore_mode: DISABLED
    turn_on_action:
      - lambda: |-
          if (wh27s::research_link() != nullptr) wh27s::research_link()->set_operation(true);
    turn_off_action:
      - lambda: |-
          if (wh27s::research_link() != nullptr) wh27s::research_link()->set_operation(false);

number:
  - platform: template
    name: Set Water Temperature
    icon: mdi:thermometer-water
    id: wh27s_set_temperature
    unit_of_measurement: "\u00b0C"
    device_class: temperature
    min_value: 35
    max_value: 60
    step: 1
    mode: SLIDER
    optimistic: false
    update_interval: 1s
    lambda: return id(wh27s_target_temperature).state;
    set_action:
      - lambda: |-
          auto *link = wh27s::research_link();
          if (link != nullptr && link->set_temperature(x))
            id(wh27s_requested_target).publish_state(x);

select:
  - platform: template
    name: Operating Mode
    icon: mdi:water-boiler
    id: wh27s_operating_mode
    options:
      - Heat Pump (Eco)
      - Auto
      - Turbo
      - Vacation
    optimistic: false
    update_interval: 1s
    lambda: |-
      auto *link = wh27s::research_link();
      if (link == nullptr) return {};
      const float mode = link->telemetry.value(505);
      if (!std::isfinite(mode)) return {};
      const char *name = wh27s::mode_name(static_cast<uint32_t>(mode));
      if (name == nullptr) return {};
      return {name};
    set_action:
      - lambda: |-
          auto *link = wh27s::research_link();
          for (uint32_t mode = 25; mode <= 28; ++mode) {
            if (x == wh27s::mode_name(mode)) {
              if (link != nullptr && link->set_mode(mode))
                id(wh27s_requested_mode).publish_state(x);
              return;
            }
          }

button:
  - platform: template
    name: UART Start Read Session
    icon: mdi:restart
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (wh27s::research_link() != nullptr) wh27s::research_link()->start_reads();
  - platform: template
    name: UART Discovery
    icon: mdi:magnify-scan
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (wh27s::research_link() != nullptr) wh27s::research_link()->probe(1, {0xAA, 0x43});
  - platform: template
    name: UART Read Status
    icon: mdi:refresh
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (wh27s::research_link() != nullptr) wh27s::research_link()->probe(2, {0x7D, 0x42});
  - platform: template
    name: UART Read Firmware Info
    icon: mdi:chip
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (wh27s::research_link() != nullptr) wh27s::research_link()->probe(2, {0xE4, 0xC0});
  - platform: template
    name: UART Request Smart Diagnosis
    icon: mdi:stethoscope
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (wh27s::research_link() != nullptr) wh27s::research_link()->probe(2, {0xE6, 0x00});

binary_sensor:
  # App T20Parser treats any nonzero airState.diagCode (545) as an error.
  - platform: template
    name: Problem
    icon: mdi:alert
    device_class: problem
    lambda: |-
      auto *link = wh27s::research_link();
      if (link == nullptr) return {};
      const float code = link->telemetry.value(545);
      if (std::isnan(code)) return {};
      return code != 0;

