    update_interval: 1s
    lambda: |-
      if (wh27s::research_link() == nullptr) return {"Starting"};
      return {wh27s::research_link()->temperature.operation_state_name()};
  - platform: template
    name: UART Read Session
    icon: mdi:connection
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      if (wh27s::research_link() == nullptr) return {"Starting"};
      if (wh27s::research_link()->bridge_enabled()) return {"Bridge"};
      switch (wh27s::research_link()->session.stage()) {
        case wh27s::ReadSession::Stage::IDLE: return {"Idle"};
        case wh27s::ReadSession::Stage::DISCOVERY: return {"Discovery"};
        case wh27s::ReadSession::Stage::CAPABILITIES: return {"Capabilities"};
        case wh27s::ReadSession::Stage::STATUS: return {"Status"};
        case wh27s::ReadSession::Stage::READY: return {"Ready"};
        case wh27s::ReadSession::Stage::FAILED: return {"No response"};
      }
      return {"Unknown"};
