  - platform: template
    name: Extraordinary Operation Raw
    icon: mdi:fire-alert
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return wh27s::research_link() ? wh27s::research_link()->telemetry.value(804) : NAN;
  - platform: template
    name: Power Input
    icon: mdi:flash
    id: wh27s_power_input
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return wh27s::research_link() ? wh27s::research_link()->telemetry.value(691) : NAN;
  # Stock modem combines 100*562+563 into one counter; Wh scale is inferred from integrating 691.
  # The heater counter is short-span (resets/wraps), so it is not a lifetime total.
  - platform: template
    name: Energy Counter
    icon: mdi:counter
    id: wh27s_energy
    entity_category: diagnostic
    unit_of_measurement: Wh
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      auto *link = wh27s::research_link();
      if (link == nullptr) return NAN;
      const float whole = link->telemetry.value(562);
      const float hundredths = link->telemetry.value(563);
      if (std::isnan(whole) || std::isnan(hundredths) || hundredths > 99) return NAN;
      return whole + hundredths / 100.0f;
  # Lifetime total accumulated on the ESP like the stock modem: only increases count (power loss reverts the heater counter to a saved value).
  - platform: template
    name: Energy Consumption
    icon: mdi:lightning-bolt
    id: wh27s_energy_consumption
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      static int32_t previous = -1;
      auto *link = wh27s::research_link();
      if (link == nullptr) return NAN;
      const float whole = link->telemetry.value(562);
      const float hundredths = link->telemetry.value(563);
      if (std::isnan(whole) || std::isnan(hundredths) || hundredths > 99) return NAN;
      const int32_t counter = static_cast<int32_t>(whole) * 100 + static_cast<int32_t>(hundredths);
      if (previous >= 0 && counter > previous) {
        id(wh27s_energy_total_cwh) += counter - previous;
      }
      previous = counter;
      return id(wh27s_energy_total_cwh) / 100000.0f;
  # 853 is MT_FILTER_REMAIN_TIME: panel filter reset on 2026-11-03 set it 0 -> 854 (4320); unit unverified.
  - platform: template
    name: Filter Remaining
    icon: mdi:air-filter
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      auto *link = wh27s::research_link();
      if (link == nullptr) return NAN;
      const float remaining = link->telemetry.value(853);
      const float maximum = link->telemetry.value(854);
      if (std::isnan(remaining) || std::isnan(maximum) || maximum <= 0) return NAN;
      return std::min(100.0f, 100.0f * remaining / maximum);
  - platform: template
