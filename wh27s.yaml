    icon: mdi:fire-alert
    update_interval: 5s
    lambda: |-
      auto *link = wh27s::research_link();
      if (link == nullptr) return {};
      const float code = link->telemetry.value(804);
      if (std::isnan(code)) return {};
      if (code == 0) return {"Off"};
      if (code == 1) return {"Emergency heating"};
      return {"Unknown (" + std::to_string(static_cast<uint32_t>(code)) + ")"};
